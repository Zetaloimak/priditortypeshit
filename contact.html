<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact PTS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header.home {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 20px;
            padding: 20px;
            background: #007bff;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header.home h1 {
            font-size: 2rem;
        }

        main {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        main h1 {
            font-size: 1.4rem;
            color: #2c3e50;
            border-bottom: 2px solid #007bff;
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
        }

        li {
            margin-bottom: 12px;
        }

        li a {
            display: block;
            padding: 10px 15px;
            background-color: #f8f9fa;
            color: #007bff;
            text-decoration: none;
            border-radius: 5px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease-in-out;
            font-weight: 600;
        }

        li a:hover {
            background-color: #007bff;
            color: white;
            transform: translateY(-2px);
        }

        .contact-email {
            padding: 10px 15px;
            background-color: #eef2f7;
            border-radius: 5px;
            font-weight: 600;
            color: #4a5568;
        }
    </style>
</head>
<body>

    <header class="home">
        <section id="home">
            <h1>Contact (PTS)</h1>
        </section>
    </header>

    <main>
        <h1>Contact Server</h1>
        <ul>
            <li><a href="https://www.google.com">Report the bug</a></li>
            <li><a href="https://www.google.com">Report the server</a></li>
            <li><a href="https://www.google.com">Frequently Asked Questions</a></li>
        </ul>
    </main>

    <main>
        <h1>Contact Information</h1>
        <ul>
            <li><a href="info.html">BACK TO WEBSITE</a></li>
            <li><a href="https://github.com/Zetaloimak">GitHub</a></li>
            <li><a href="https://www.google.com">Frequently Asked Questions</a></li>
            <li class="contact-email">Gmail: priditortypeshit@gmail.com</li>
        </ul>
    </main>

</body>
</html>
